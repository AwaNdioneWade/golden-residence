<section id="contact" class="contact-section relative py-14 md:py-20 lg:py-24">
  <div class="contact-section-inner mx-auto max-w-[1240px] px-4 md:px-[100px]">
    <!-- En-tête -->
    <header class="mb-10 text-center md:mb-14">
      <h2
        class="font-serif text-3xl font-bold leading-tight text-black md:text-4xl lg:text-[2.75rem]">
        <span class="inline-block border-b border-black pb-1">Contactez</span>
        <span class="inline-block">&nbsp;- nous</span>
      </h2>
      <p class="mx-auto mt-5 max-w-2xl text-base text-gray-600 md:text-lg">
        Notre équipe est à votre écoute pour toute demande d'information ou de réservation.
      </p>
    </header>

    <!-- Carte principale : formulaire | carte -->
    <div class="contact-card overflow-hidden rounded-2xl shadow-[0_4px_40px_rgba(0,0,0,0.06)] md:rounded-3xl">
      <form
        [formGroup]="contactForm"
        (ngSubmit)="onSubmit()"
        class="flex flex-col lg:min-h-[28rem] lg:flex-row lg:items-stretch">
        <!-- Colonne formulaire -->
        <div
          class="contact-form-column flex flex-1 flex-col gap-5 p-6 sm:p-8 md:gap-6 md:p-10 lg:max-w-[55%]">
          <div class="grid grid-cols-1 gap-5 md:grid-cols-2 md:gap-6">
            <div class="flex flex-col gap-1.5">
              <label for="nom" class="text-sm font-medium text-gray-500">Nom Complet</label>
              <input
                id="nom"
                type="text"
                formControlName="nom"
                placeholder="Jonnie Dawson"
                autocomplete="name"
                class="contact-input w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-gray-900 placeholder:text-gray-400 focus:border-[#D4AF37] focus:outline-none focus:ring-2 focus:ring-[#D4AF37]/20" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="telephone" class="text-sm font-medium text-gray-500">Numéro de téléphone</label>
              <div class="flex overflow-hidden rounded-lg border border-gray-200 bg-white focus-within:ring-2 focus-within:ring-[#D4AF37]/20">
                <span
                  class="flex shrink-0 items-center border-r border-gray-200 bg-gray-50/80 px-3 py-3 text-xl"
                  aria-hidden="true"
                  >🇸🇳</span
                >
                <input
                  id="telephone"
                  type="tel"
                  formControlName="telephone"
                  placeholder="+221 00 000 00 00"
                  autocomplete="tel"
                  class="min-w-0 flex-1 border-0 bg-white px-3 py-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-0" />
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="email" class="text-sm font-medium text-gray-500">Adresse e-mail</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="willie.jennings@example.com"
              autocomplete="email"
              class="contact-input w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-gray-900 placeholder:text-gray-400 focus:border-[#D4AF37] focus:outline-none focus:ring-2 focus:ring-[#D4AF37]/20" />
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="message" class="text-sm font-medium text-gray-500">Message</label>
            <textarea
              id="message"
              formControlName="message"
              rows="5"
              placeholder="Votre message ou demande"
              class="contact-input w-full resize-none rounded-lg border border-gray-200 bg-white px-4 py-3 text-gray-900 placeholder:text-gray-400 focus:border-[#D4AF37] focus:outline-none focus:ring-2 focus:ring-[#D4AF37]/20"></textarea>
          </div>

          <div class="flex items-start gap-3 pt-1">
            <input
              id="acceptConditions"
              type="checkbox"
              formControlName="acceptConditions"
              class="contact-checkbox mt-0.5 h-5 w-5 shrink-0 cursor-pointer rounded border-gray-300 text-[#D4AF37] focus:ring-[#D4AF37]" />
            <label for="acceptConditions" class="cursor-pointer text-sm font-semibold text-gray-900">
              J'accepte les conditions générales
            </label>
          </div>

          <div class="pt-2">
            <button
              type="submit"
              class="rounded-full bg-[#D4AF37] px-10 py-3.5 text-sm font-semibold text-white shadow-sm transition hover:bg-[#c49b2e] disabled:cursor-not-allowed disabled:opacity-60 md:text-base"
              [disabled]="!contactForm.valid">
              Envoyer le message
            </button>
          </div>
        </div>

        <!-- Colonne carte -->
        <div
          class="contact-map-wrap relative min-h-[280px] w-full bg-gray-100 sm:min-h-[320px] lg:min-h-full lg:w-[45%] lg:min-w-[40%]">
          <iframe
            title="Carte — Golden Résidence, Thiès"
            class="absolute inset-0 h-full w-full border-0"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3858.5!2d-16.926!3d14.7895!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xec172f6b8b8b8b8b%3A0x1!2sThi%C3%A8s%2C%20S%C3%A9n%C3%A9gal!5e0!3m2!1sfr!2ssn!4v1700000000000!5m2!1sfr!2ssn"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </form>
    </div>
  </div>

  <!-- WhatsApp -->
  <a
    href="https://wa.me/221000000000"
    target="_blank"
    rel="noopener noreferrer"
    class="contact-wa fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full shadow-lg transition-transform hover:scale-105 md:bottom-8 md:right-8"
    style="background-color: #25d366"
    aria-label="Contacter sur WhatsApp">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path
        d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"
        fill="white" />
    </svg>
  </a>
</section>
