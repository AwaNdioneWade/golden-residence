<section class="" style="background-color: #FFF4EA;">
  <div class="container mx-auto px-4 md:px-[100px]">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-12 items-center">
      <!-- Left Column - Newsletter Content -->
      <div>
        <!-- Title with Decorative Icon -->
        <div class="flex items-center gap-[20px] mb-4">
          <h2 class="text-[24px] md:text-[40px] lg:text-[52px] font-bold text-gray-900">
            Newsletter
          </h2>
          <!-- Decorative Star Icon -->
          <svg width="52" height="60" viewBox="0 0 52 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M25.9808 0L27.1658 27.9475L51.9615 15L28.3508 30L51.9615 45L27.1658 32.0525L25.9808 60L24.7958 32.0525L1.14441e-05 45L23.6108 30L1.14441e-05 15L24.7958 27.9475L25.9808 0Z" fill="#E3572B"/>
          </svg>            
        </div>

        <!-- Description -->
        <p class="text-[#00000099] text-[12px] md:text-[16px] mb-8 leading-relaxed">
          Rejoignez notre newsletter et profitez d'avantages réservés à nos abonnés.
        </p>

        <!-- Newsletter Form -->
        <form [formGroup]="newsletterForm" (ngSubmit)="onSubmit()" class="flex flex-col sm:flex-row gap-3">
          <div class="flex-1 relative">
            <!-- Mail Icon -->
            <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
              <svg 
                width="20" 
                height="20" 
                viewBox="0 0 20 20" 
                fill="none" 
                xmlns="http://www.w3.org/2000/svg">
                <path 
                  d="M2.5 5.83333L10 11.25L17.5 5.83333M3.33333 15H16.6667C17.5871 15 18.3333 14.2538 18.3333 13.3333V6.66667C18.3333 5.74619 17.5871 5 16.6667 5H3.33333C2.41286 5 1.66667 5.74619 1.66667 6.66667V13.3333C1.66667 14.2538 2.41286 15 3.33333 15Z" 
                  stroke="#666666" 
                  stroke-width="1.5" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"/>
              </svg>
            </div>
            <input 
              type="email" 
              formControlName="email"
              placeholder="Entrer votre adresse e-mail"
              class="w-full pl-12 pr-4 py-3 rounded-[40px] border border-[#DCDCDC] bg-transparent focus:outline-none focus:ring-2 focus:ring-[#F59E0B] focus:border-transparent">
          </div>
          <button 
            type="submit"
            class="px-8 py-3 rounded-[100px] text-white font-semibold transition-colors duration-200 shadow-lg whitespace-nowrap"
            style="background-color: #F59E0B;"
            [disabled]="!newsletterForm.valid">
            S'inscrire
          </button>
        </form>
      </div>

      <!-- Right Column - Image -->
      <div class="relative flex justify-end">
        <!-- Decorative Frame -->
        <!-- <div class="absolute inset-0 z-0" style="background: #F5E6D3; border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; border: 2px solid #D4AF36; transform: rotate(-8deg);"></div> -->
        
        <!-- Image -->
        <!-- <div class="relative z-10 rounded-lg overflow-hidden shadow-xl" style="border-radius: 20px;"> -->
          <img 
            src="assets/images/image_newsletter.png" 
            alt="Chambre d'hôtel moderne"
            class="w-full h-[454px] object-cover">
        <!-- </div> -->
      </div>
    </div>
  </div>
</section>
