<section class="py-16 md:py-24 bg-white relative">
  <div class="container mx-auto px-4 md:px-[100px]">
    <!-- Section Header -->
    <div class="text-center mb-12 md:mb-16">
      <h2 class="text-4xl md:text-5xl lg:text-6xl font-bold mb-4 text-gray-900" style="font-family: serif;">
        Témoignages
      </h2>
      <p class="text-gray-600 text-lg md:text-xl">
        Ce que disent nos clients.
      </p>
    </div>

    <!-- Testimonial Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">
      <div 
        *ngFor="let temoignage of temoignages"
        class="bg-white rounded-[20px] border border-[#E2E8F0] p-[20px] md:p-[24px] shadow-sm hover:shadow-md transition-shadow duration-300 relative">
        
        <!-- Profile Picture and Info -->
        <div class="flex items-center mb-[16px]">
          <img 
            [src]="temoignage.photo" 
            [alt]="temoignage.nom"
            class="w-16 h-16 rounded-full object-cover mr-4">
          <div class="flex-1">
            <h3 class="font-medium text-[#1E1E1E] text-[16px] leading-[160%]">
              {{ temoignage.nom }}
            </h3>
            <p class="text-[#00000066] text-[16px] font-medium leading-[160%]">
              {{ temoignage.date }}
            </p>
          </div>
          
          <!-- Quote Icon -->
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M25 35H35C35.663 35 36.2989 34.7366 36.7678 34.2678C37.2366 33.7989 37.5 33.163 37.5 32.5V22.5C37.5 21.837 37.2366 21.2011 36.7678 20.7322C36.2989 20.2634 35.663 20 35 20H27.5C27.5 14.485 31.985 10 37.5 10V5C29.2275 5 22.5 11.7275 22.5 20V32.5C22.5 33.163 22.7634 33.7989 23.2322 34.2678C23.7011 34.7366 24.337 35 25 35ZM5 35H15C15.663 35 16.2989 34.7366 16.7678 34.2678C17.2366 33.7989 17.5 33.163 17.5 32.5V22.5C17.5 21.837 17.2366 21.2011 16.7678 20.7322C16.2989 20.2634 15.663 20 15 20H7.5C7.5 14.485 11.985 10 17.5 10V5C9.2275 5 2.5 11.7275 2.5 20V32.5C2.5 33.163 2.76339 33.7989 3.23223 34.2678C3.70107 34.7366 4.33696 35 5 35Z" fill="#D4AF37" fill-opacity="0.6"/>
            </svg>            
        </div>

        <!-- Quote Text -->
        <p class="text-[#1E1E1E] text-[16px] font-medium leading-[160%]">
          {{ temoignage.texte }}
        </p>
      </div>
    </div>
  </div>
</section>
