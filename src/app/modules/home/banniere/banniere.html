<div class="relative w-full h-screen overflow-hidden">
  <!-- Carousel Container -->
  <div class="relative w-full h-full">
    <!-- Slides -->
    <div 
      class="flex transition-transform duration-1000 ease-in-out h-full"
      [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
      <div 
        *ngFor="let slide of slides; let i = index"
        class="min-w-full h-full relative">
        <!-- Background Image -->
        <img 
          [src]="slide.image" 
          [alt]="slide.title"
          class="w-full h-full object-cover">
        
        <!-- Overlay Content -->
        <div class="absolute inset-0 flex items-center justify-center z-20">
          <div class="px-4 md:px-[100px] w-full relative z-30">
            <div class="max-w-3xl mx-auto text-center">
              <!-- Location Tag -->
              <div class="mb-4 relative z-40 flex justify-center">
                <span 
                  class="inline-block px-3 py-1.5 text-[12px] md:text-[16px] font-medium rounded-[100px] border border-[#D4AF36]"
                  style="background-color: #D4AF374D; color: #F59E0B;">
                  ZAC NGUINTH, THIÈS
                </span>
              </div>
              
              <!-- Main Title -->
              <h1 class="text-4xl md:text-[32px] lg:text-[48px] xl:text-[52px] font-bold mb-3 leading-[160%] relative z-40">
                <span class="text-white drop-shadow-lg">{{ slide.title }}</span>
                <span class="block mt-1 drop-shadow-lg" style="color: #D4AF36;">{{ slide.subtitle }}</span>
              </h1>
              
              <!-- Description -->
              <p class="text-white text-base md:text-[12px] lg:text-[16px] mb-6 max-w-[772px] mx-auto leading-relaxed relative z-40 drop-shadow-lg">
                {{ slide.description }}
              </p>
              
              <!-- CTA Buttons -->
              <div class="flex flex-col sm:flex-row gap-3 relative z-40 justify-center">
                <button 
                  class="rounded-[100px] px-6 py-2.5 md:px-8 md:py-3 bg-[#F59E0B] hover:bg-[#D4AF36] text-white text-sm md:text-base font-semibold transition-colors duration-200 shadow-lg">
                  Voir nos chambres
                </button>
                <button 
                  class="rounded-[100px] px-6 py-2.5 md:px-8 md:py-3 bg-gray-700 hover:bg-gray-800 text-white text-sm md:text-base font-semibold transition-colors duration-200 shadow-lg">
                  <span class="text-[12px] md:text-[16px] font-medium">En savoir plus</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Pagination Dots -->
  <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex gap-3 z-10">
    <button
      *ngFor="let slide of slides; let i = index"
      (click)="goToSlide(i)"
      class="w-3 h-3 rounded-full transition-all duration-300"
      [class.bg-amber-400]="currentSlide === i"
      [class.bg-white]="currentSlide !== i"
      [class.opacity-100]="currentSlide === i"
      [class.opacity-50]="currentSlide !== i">
    </button>
  </div>
</div>
