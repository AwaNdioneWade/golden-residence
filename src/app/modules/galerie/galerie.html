<div class="bg-white">
  <header class="border-b border-black/5 bg-gradient-to-b from-[#faf9f7] to-white pt-28 pb-12 md:pt-32 md:pb-16">
    <div class="mx-auto max-w-7xl px-4 md:px-[100px]">
      <nav class="mb-7 text-sm font-medium text-gray-500" aria-label="Fil d'Ariane">
        <ol class="flex flex-wrap items-center gap-2">
          <li>
            <a routerLink="/" class="transition hover:text-[#D4AF37]">Accueil</a>
          </li>
          <li aria-hidden="true" class="text-gray-400">/</li>
          <li class="text-gray-900">Galerie</li>
        </ol>
      </nav>

      <h1 class="font-serif text-3xl font-bold text-[#1E1E1E] md:text-4xl lg:text-[2.75rem]">Galerie Photos</h1>
      <p class="mt-3 max-w-2xl text-base leading-relaxed text-gray-600 md:text-lg">
        Explorez les espaces de Golden Résidence : chambres, suites, zones de détente et espaces professionnels.
      </p>
      <span class="mt-5 inline-block h-0.5 w-[139px] rounded-full bg-[#D4AF37]" aria-hidden="true"></span>
    </div>
  </header>

  <section class="py-12 md:py-16">
    <div class="mx-auto max-w-7xl px-4 md:px-[100px]">
      <h2 class="sr-only">Galerie mise en avant</h2>

      <div class="grid grid-cols-1 gap-4 md:grid-cols-2 md:gap-5">
        <article class="overflow-hidden rounded-xl">
          <img [src]="featured[0].src" [alt]="featured[0].alt" class="h-full w-full object-cover" />
        </article>

        <div class="flex flex-col gap-4 md:gap-5">
          <article class="overflow-hidden rounded-xl">
            <img [src]="featured[1].src" [alt]="featured[1].alt" class="h-full w-full min-h-[260px] object-cover md:min-h-[320px]" />
          </article>
          <article class="overflow-hidden rounded-xl">
            <img [src]="featured[2].src" [alt]="featured[2].alt" class="h-full w-full min-h-[260px] object-cover md:min-h-[320px]" />
          </article>
        </div>
      </div>
    </div>
  </section>

  <section class="pb-16 md:pb-24">
    <div class="mx-auto max-w-7xl px-4 md:px-[100px]">
      <h2 class="mb-6 text-xl font-bold text-[#1E1E1E] md:mb-8 md:text-2xl">Autres vues</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 lg:gap-5">
        <article
          *ngFor="let item of mosaic"
          class="overflow-hidden rounded-xl border border-black/5 bg-white shadow-[0_8px_24px_rgba(0,0,0,0.06)]">
          <img [src]="item.src" [alt]="item.alt" class="h-56 w-full object-cover md:h-60" />
        </article>
      </div>
    </div>
  </section>
</div>
