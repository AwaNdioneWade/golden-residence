<nav
  class="fixed top-0 left-0 right-0 z-50 flex justify-center pt-4 md:pt-6 px-4 sm:px-6 md:px-10 pointer-events-none"
  aria-label="Navigation principale">
  <div
    class="navbar-shell pointer-events-auto relative flex w-full max-w-[min(100%,72rem)] items-center justify-between gap-4 rounded-full px-5 py-3.5 sm:px-8 sm:py-4 md:px-10 md:py-[20px]"
    [class.navbar-shell--scrolled]="isScrolled">
    <!-- Marque (texte uniquement, serif) -->
    <a
      routerLink="/"
      class="navbar-brand shrink-0 font-serif text-lg font-semibold tracking-tight sm:text-xl md:text-2xl">
      <span class="navbar-brand-golden">Golden</span><span class="navbar-brand-residence"> Résidence</span>
    </a>

    <!-- Bouton hamburger (mobile) -->
    <button
      type="button"
      class="navbar-hamburger md:hidden"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Ouvrir le menu"
      (click)="toggleMobileMenu()">
      <span [class.is-open]="isMobileMenuOpen"></span>
      <span [class.is-open]="isMobileMenuOpen"></span>
      <span [class.is-open]="isMobileMenuOpen"></span>
    </button>

    <!-- Menu desktop -->
    <ul class="hidden md:flex flex-wrap items-center justify-end gap-x-4 gap-y-2 sm:gap-x-5 md:gap-x-7 lg:gap-x-8 text-xs sm:text-sm md:text-[15px] font-bold">
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link whitespace-nowrap">
          Accueil
        </a>
      </li>
      <li>
        <a routerLink="/reservations" routerLinkActive="active" class="nav-link whitespace-nowrap">
          Réservations
        </a>
      </li>
      <!-- <li>
        <a routerLink="/services" routerLinkActive="active" class="nav-link whitespace-nowrap">
          Services
        </a>
      </li> -->
      <li>
        <a routerLink="/" fragment="apropos" class="nav-link whitespace-nowrap">
          À propos
        </a>
      </li>
      <li>
        <a routerLink="/galerie" routerLinkActive="active" class="nav-link whitespace-nowrap">
          Galerie
        </a>
      </li>
      <li>
        <a routerLink="/" fragment="contact" class="nav-link whitespace-nowrap">
          Contact
        </a>
      </li>
    </ul>

    <!-- Menu mobile -->
    <ul
      class="navbar-mobile-menu md:hidden"
      [class.navbar-mobile-menu--open]="isMobileMenuOpen">
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          (click)="closeMobileMenu()">
          Accueil
        </a>
      </li>
      <li>
        <a
          routerLink="/reservations"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMobileMenu()">
          Réservations
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="apropos"
          class="nav-link"
          (click)="closeMobileMenu()">
          À propos
        </a>
      </li>
      <li>
        <a
          routerLink="/galerie"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMobileMenu()">
          Galerie
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="contact"
          class="nav-link"
          (click)="closeMobileMenu()">
          Contact
        </a>
      </li>
    </ul>
  </div>
</nav>
